<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الموسم الأول | ساموراي جاك</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Paytone+One&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.page{max-width:1200px;margin:auto;padding:30px 22px}.back{color:#ffe02f;font-weight:800}.hint{color:#9ca8b7}.episodes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.episode{overflow:hidden;border:1px solid #293441;border-radius:11px;background:#10151d}.poster{height:160px;background:linear-gradient(135deg,#7f170e,#151c28);display:grid;place-items:center;color:#fff9;font:42px 'Paytone One',sans-serif}.poster img{width:100%;height:100%;object-fit:cover}.info{padding:12px}.info h2{font-size:16px;margin:0 0 10px}.watch{display:block;text-align:center;background:#ffe02f;color:#111;padding:8px;border-radius:7px;font-weight:900;font-size:13px}.help{margin-top:22px;padding:14px;border:1px solid #293441;border-radius:9px;color:#b9c4d2;font-size:13px}@media(max-width:850px){.episodes{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.episodes{grid-template-columns:repeat(2,minmax(0,1fr))}.poster{height:135px}}@media(max-width:360px){.episodes{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><a class="brand" href="index.html">SAMURAI<br>JACK<span>ساموراي جاك</span></a><a class="home-link" href="index.html">العودة للرئيسية ⌂</a></header><main class="page"><a class="back" href="index.html">← العودة إلى المواسم</a><h1>الموسم الأول</h1><p class="hint">13 حلقة · ساموراي جاك مترجم عربي</p><section class="episodes" id="episodes"></section><div class="help"><b>تعديل الحلقات:</b> ضع رابط البوستر في <code>poster</code> داخل بيانات الحلقة أدناه. زر «مشاهدة الحلقة» يفتح صفحة مستقلة باسم الحلقة، ومنها يختار الزائر Google Drive أو MEGA.</div></main>
<script>
/* ضع رابط البوستر في poster لكل حلقة. روابط Drive وMEGA موجودة في ملف الحلقة نفسها. */
const episodes=[{title:"الحلقة 1",poster:"https://i.postimg.cc/ZqDXB4rk/image.png"},{title:"الحلقة 2",poster:"https://i.postimg.cc/prMGzTr3/image.png"},{title:"الحلقة 3",poster:"https://i.postimg.cc/3xxLgzrv/image.png"},{title:"الحلقة 4",poster:"https://i.postimg.cc/5yJgjRkj/image.png"},{title:"الحلقة 5",poster:"https://i.postimg.cc/hPpsPM8P/image.png"},{title:"الحلقة 6",poster:"https://i.postimg.cc/kG7N7tBW/image.png"},{title:"الحلقة 7",poster:"https://i.postimg.cc/XYtwpPp2/image.png"},{title:"الحلقة 8",poster:"https://i.postimg.cc/ZR4vNzZM/image.png"},{title:"الحلقة 9",poster:"https://i.postimg.cc/3wBJP4QM/image.png"},{title:"الحلقة 10",poster:"https://i.postimg.cc/zXgDqPYy/image.png"},{title:"الحلقة 11",poster:"https://i.postimg.cc/xdtn6wMR/image.png"},{title:"الحلقة 12",poster:"https://i.postimg.cc/ncBs3Lrf/image.png"},{title:"الحلقة 13",poster:"https://i.postimg.cc/50XyL4TB/image.png"}];
const holder=document.getElementById("episodes");episodes.forEach((ep,i)=>{const c=document.createElement("article");c.className="episode";const p=document.createElement("div");p.className="poster";if(ep.poster.trim()){const im=document.createElement("img");im.src=ep.poster.trim();im.alt="بوستر "+ep.title;p.append(im)}else p.textContent=String(i+1).padStart(2,"0");const info=document.createElement("div");info.className="info";const h=document.createElement("h2");h.textContent=ep.title;const a=document.createElement("a");a.className="watch";a.textContent="▶ مشاهدة الحلقة";a.href="episode-"+String(i+1).padStart(2,"0")+".html";info.append(h,a);c.append(p,info);holder.append(c)});
</script></body></html>
